<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>HOODSTAR | Hip Hop & Culture</title><style>
*{box-sizing:border-box}body{margin:0;background:#e7e7e7;color:#161616;font:15px Arial,sans-serif}header{background:#090909;color:white;border-bottom:5px solid #cf101b}.head{max-width:1200px;margin:auto;display:flex;align-items:center;justify-content:space-between;padding:20px 14px;gap:12px}.logo{font:bold italic 48px Impact,'Arial Black',sans-serif;letter-spacing:-2px;cursor:pointer}.logo span{color:#e3202b}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0;font-weight:bold;padding:10px 14px}button:hover{filter:brightness(.85)}.red{background:#cb111b;color:white}nav{background:#242424;display:flex;justify-content:center;flex-wrap:wrap}nav button{background:transparent;color:white;text-transform:uppercase;font-size:13px}nav button.active{background:#c8101c}.wrap{max-width:1200px;margin:auto;background:white;padding:16px}.ad{background:#151515;color:white;text-align:center;padding:25px 10px;border-bottom:4px solid #c8101c;margin-bottom:20px}.ad strong{font:italic bold 38px Impact,Arial,sans-serif}.ad small{display:block;letter-spacing:3px;margin:10px}.bar{display:flex;align-items:center;justify-content:space-between;border-bottom:3px solid #c8101c;margin:20px 0 12px}.bar h2{margin:0;background:#c8101c;color:white;padding:8px 12px;font-size:18px;text-transform:uppercase}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:15px}.featured{grid-template-columns:2fr 1fr 1fr}.item{cursor:pointer;border-bottom:1px solid #ccc;padding-bottom:12px}.thumb{aspect-ratio:16/9;background:linear-gradient(135deg,#292929,#080808);position:relative;display:grid;place-items:center;overflow:hidden;color:#fff}.thumb b{font:italic bold clamp(15px,2.5vw,35px) Impact,Arial,sans-serif;text-align:center;padding:12px;max-width:90%;text-transform:uppercase;transform:skew(-5deg)}.thumb:before{content:'★';position:absolute;font-size:180px;color:#ffffff0c;transform:rotate(-15deg)}.play{position:absolute;bottom:8px;left:8px;background:#c8101c;padding:5px 9px}.tag{position:absolute;top:0;left:0;font-size:10px;background:#c8101c;padding:5px}.item h3{font-size:16px;line-height:1.25;margin:8px 0}.meta{color:#777;font-size:12px}.search{display:flex}.search input{width:180px;padding:9px;border:0}.player{aspect-ratio:16/9;background:#111;color:white;display:grid;place-items:center;text-align:center;padding:25px}.actions{display:flex;gap:8px;margin:15px 0;flex-wrap:wrap}.actions button{background:#eee}.hidden{display:none!important}footer{text-align:center;background:#121212;color:#aaa;padding:30px;font-size:12px}dialog{border:0;width:min(500px,94vw);padding:24px}dialog::backdrop{background:#0009}dialog input,dialog textarea{display:block;width:100%;margin:10px 0;padding:10px;border:1px solid #bbb}.notice{font-size:12px;color:#666;padding:8px 0} @media(max-width:700px){.head{flex-wrap:wrap}.logo{font-size:36px}.grid{grid-template-columns:repeat(2,1fr);gap:10px}.featured{grid-template-columns:1fr 1fr}.featured .item:first-child{grid-column:span 2}.wrap{padding:10px}.search input{width:130px}.item h3{font-size:14px}.ad strong{font-size:30px}}
 .thumb img{position:absolute;width:100%;height:100%;object-fit:cover}.tag,.play{z-index:1}.player iframe{width:100%;height:100%;border:0}.player.embedded{padding:0;display:block}.collection{padding:12px;background:#eee;margin:12px 0}.collection select,dialog select{padding:10px;width:100%;margin:8px 0}.adminrow{border-bottom:1px solid #ddd;padding:10px 0;display:flex;gap:8px;align-items:center}.adminrow span{flex:1}.note{border-left:4px solid #c8101c;padding:12px;background:#eee;white-space:pre-wrap}dialog[open]{position:fixed;inset:0;margin:auto;z-index:1000;background:white;box-shadow:0 0 0 100vmax #0009}dialog{max-height:90vh;overflow:auto}dialog label{font-weight:bold;font-size:13px} .head{flex-wrap:wrap} .player.vertical{aspect-ratio:9/16;max-width:420px;margin:auto;max-height:80vh}.player.vertical iframe{background:#000}</style><header><div class="head"><div class="logo" onclick="home()">HOOD<span>STAR</span>★</div><form class="search" id="search"><input id="q" placeholder="Search videos" aria-label="Search videos"><button class="red">SEARCH</button></form><button class="red" onclick="openDialog(document.querySelector('#submit'))">SUBMIT VIDEO</button></div><nav id="nav"></nav></header><main class="wrap"><div class="ad"><small>HUGH AUGUSTINE × TROX</small><strong>HOOD STAR — THE ALBUM</strong><small>COMING 2027 · H91</small></div><div id="content"></div></main><footer>HOODSTAR • POWERED BY H91<br><br>Independent music & culture platform</footer><dialog id="submit"><h2>Submit your Hood Star</h2><form id="submission"><input id="s-name" required placeholder="Your name"><input id="s-email" required type="email" placeholder="Email"><input id="s-url" required type="url" placeholder="Video URL"><textarea id="s-about" required placeholder="Tell us about your submission"></textarea><p class="notice">Sending opens your email app with your submission filled in. Just hit send.</p><button class="red">SEND SUBMISSION</button> <button type="button" onclick="this.closest('dialog').close()">CANCEL</button></form></dialog><script>
/* ===== SETTINGS: the only lines you should ever need to change ===== */
const SHEET_ID='1zd_ouSDU5ZBT7u24OM4LWvVfsFzN42H-og2Bycn5KQk'; // HOODSTAR Video Library (Google Sheet)
const SHEET_TAB='Library';
const SUBMIT_EMAIL='yohugh91@gmail.com'; // where "Submit Video" emails go
/* ==================================================================== */
const cats=['Home','Trending','Music','Culture','Community','Exclusives','Premieres','Inspiration','Archives','Cinema','Style & Design','Collections'];
const songs=['Hood Star','Toni Childs','Smoke In My Lungs','Policy','Brutalist','RSVP','Shoes on My Feet','PTSD','Free Man','Forever','Real Love','Blue Takis'];
// Backup library: shown instantly and used if the Sheet can't be reached.
const BACKUP=[['','What Makes A Hood Star? EP. 001 — Tre','WHAT MAKES A HOOD STAR?','Community','Filmed','','','H91 Network','Yes','','Yes'],['','Pass The Aux: Tre','PASS THE AUX','Music','Filmed','','','H91 Network','Yes','','Yes'],['','Hood Star: Official Album Teaser','HOOD STAR','Premieres','Coming soon','Hood Star','','H91 Network','Yes','','Yes'],['','Road To Hood Star: Inside The Album','ROAD TO HOOD STAR','Exclusives','Coming soon','','','H91 Network','','','Yes'],['','Story Behind The Bar: Toni Childs','STORY BEHIND THE BAR','Music','Coming soon','Toni Childs','','H91 Network','','','Yes'],['','Hood Star Field Trips: Leimert Park','FIELD TRIPS','Culture','Coming soon','','','H91 Network','','','Yes'],['','Beats & Eats','BEATS & EATS','Culture','Coming soon','','','H91 Network','','','Yes'],['','Can I Make It Vegan?','CAN I MAKE IT VEGAN?','Culture','Coming soon','','','H91 Network','','','Yes'],['','15 Years Later','15 YEARS LATER','Exclusives','Coming soon','','','H91 Network','','','Yes']];
const $=s=>document.querySelector(s);
function openDialog(d){if(d.showModal){try{d.showModal();return}catch{}}d.setAttribute('open','')}
const safe=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const get=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}};
const put=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch{}};
const yes=v=>/^(y|yes|true|x|1)$/i.test(String(v||'').trim());
function youtubeId(raw){try{let u=new URL(String(raw).trim()),h=u.hostname.toLowerCase().replace(/^(www\.|m\.|music\.)/,''),id='';if(!/^https?:$/.test(u.protocol))return null;if(h==='youtu.be')id=u.pathname.split('/')[1];else if(h==='youtube.com'||h==='youtube-nocookie.com'){id=u.pathname==='/watch'?u.searchParams.get('v'):(/^\/(embed|shorts|live|v)\//.test(u.pathname)?u.pathname.split('/')[2]:'')}return /^[A-Za-z0-9_-]{11}$/.test(id||'')?id:null}catch{return null}}
// Works out the platform, a playable embed (when the platform allows one) and a thumbnail for any video link.
function media(raw){raw=String(raw||'').trim();if(!raw)return null;let u;try{u=new URL(/^https?:\/\//i.test(raw)?raw:'https://'+raw)}catch{return null}let h=u.hostname.toLowerCase().replace(/^(www\.|m\.|mobile\.|vm\.|vt\.)/,''),p=u.pathname,m,link=u.href;let yt=youtubeId(link);if(yt)return{platform:'YouTube',key:yt,link:'https://www.youtube.com/watch?v='+yt,embed:`https://www.youtube-nocookie.com/embed/${yt}?rel=0`,thumb:`https://i.ytimg.com/vi/${yt}/hqdefault.jpg`,vertical:/\/shorts\//.test(p)};
if(/(^|\.)tiktok\.com$/.test(h)){m=p.match(/\/video\/(\d+)/)||p.match(/\/embed\/(?:v2\/)?(\d+)/);return m?{platform:'TikTok',key:'tt'+m[1],link,embed:`https://www.tiktok.com/embed/v2/${m[1]}`,vertical:true}:{platform:'TikTok',key:'tt-'+slug(p),link}}
if(/(^|\.)instagram\.com$/.test(h)){m=p.match(/\/(p|reel|reels|tv)\/([A-Za-z0-9_-]+)/);if(m){let kind=m[1]==='reels'?'reel':m[1];return{platform:'Instagram',key:'ig'+m[2],link:`https://www.instagram.com/${kind}/${m[2]}/`,embed:`https://www.instagram.com/${kind}/${m[2]}/embed/`,vertical:true}}return{platform:'Instagram',key:'ig-'+slug(p),link}}
if(/(^|\.)vimeo\.com$/.test(h)){m=p.match(/(?:\/video)?\/(\d+)/);return m?{platform:'Vimeo',key:'vm'+m[1],link,embed:`https://player.vimeo.com/video/${m[1]}`}:{platform:'Vimeo',key:'vm-'+slug(p),link}}
if(/(^|\.)(facebook\.com|fb\.watch)$/.test(h))return{platform:'Facebook',key:'fb-'+slug(p+u.search),link,embed:`https://www.facebook.com/plugins/video.php?href=${encodeURIComponent(link)}&show_text=false`};
if(/(^|\.)(twitter\.com|x\.com)$/.test(h))return{platform:'X',key:'x-'+slug(p),link};
if(/(^|\.)twitch\.tv$/.test(h))return{platform:'Twitch',key:'tw-'+slug(p),link};
if(/(^|\.)soundcloud\.com$/.test(h))return{platform:'SoundCloud',key:'sc-'+slug(p),link,embed:`https://w.soundcloud.com/player/?url=${encodeURIComponent(link)}&visual=true`};
if(/\.(mp4|webm|mov|m4v)$/i.test(p))return{platform:'Video',key:'mp4-'+slug(p),link,file:true};
let name=h.split('.').slice(-2,-1)[0]||'Link';return{platform:name.charAt(0).toUpperCase()+name.slice(1),key:'ln-'+slug(h+p),link}}
function parseCSV(t){let rows=[],row=[],f='',q=false;for(let i=0;i<t.length;i++){let c=t[i];if(q){if(c==='"'){if(t[i+1]==='"'){f+='"';i++}else q=false}else f+=c}else if(c==='"')q=true;else if(c===','){row.push(f);f=''}else if(c==='\n'||c==='\r'){if(c==='\r'&&t[i+1]==='\n')i++;row.push(f);rows.push(row);row=[];f=''}else f+=c}if(f!==''||row.length){row.push(f);rows.push(row)}return rows}
const slug=s=>String(s).toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,60)||'video';
// Turn sheet rows into video objects. Columns are matched by header name, so reordering columns in the Sheet is safe.
function buildLibrary(rows){let head=(rows[0]||[]).map(h=>h.trim().toLowerCase()),col=n=>head.indexOf(n),cell=(r,n)=>{let i=col(n);return i<0?'':String(r[i]??'').trim()};if(col('headline')<0)throw new Error('No Headline column');let used={},list=[];rows.slice(1).forEach((r,n)=>{let headline=cell(r,'headline'),link=cell(r,'video link')||cell(r,'youtube link')||cell(r,'link'),show=cell(r,'show on site');if(!headline&&!link)return;if(show&&!yes(show))return;let md=media(link);if(link&&!md)console.warn('HOODSTAR: row '+(n+2)+' has a link that could not be read:',link);let yt=md&&md.platform==='YouTube'?md.key:null;let id=md?md.key:slug(headline);while(used[id])id+='-2';used[id]=1;list.push({id,yt,md,title:headline||'Untitled video',tile:cell(r,'tile text')||headline,cat:cell(r,'category')||'Inspiration',status:cell(r,'status')||(md?'New':'Coming soon'),song:cell(r,'song collection'),note:cell(r,'curator note'),credit:cell(r,'credit')||(md?md.platform:'H91 Network'),featured:yes(cell(r,'featured')),trending:yes(cell(r,'trending')),order:n})});return list.reverse()} // newest (bottom of Sheet) first
let data=buildLibrary([['YouTube Link','Headline','Tile Text','Category','Status','Song Collection','Curator Note','Credit','Featured','Trending','Show on Site'],...BACKUP]);
let category='Home',selectedSong='',displayed='';
async function loadSheet(){if(!SHEET_ID)return;let url=`https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&headers=1&sheet=${encodeURIComponent(SHEET_TAB)}&t=${Date.now()}`;let cached=get('hs-sheet-cache',null);if(cached){try{data=buildLibrary(parseCSV(cached));route(true)}catch{}}try{let r=await fetch(url,{cache:'no-store'});if(!r.ok)throw new Error(r.status);let t=await r.text();if(/^\s*</.test(t))throw new Error('Sheet is not shared publicly');let lib=buildLibrary(parseCSV(t));data=lib;put('hs-sheet-cache',t);route(true)}catch(e){console.warn('HOODSTAR: could not load the Google Sheet, showing saved library instead.',e)}}
const byId=id=>data.find(d=>d.id===id);
function tile(d){return `<article class="item" tabindex="0" role="link" onclick="watch('${d.id}')" onkeydown="if(event.key==='Enter')watch('${d.id}')"><div class="thumb"><span class="tag">${safe(d.cat)}</span>${d.md&&d.md.thumb?`<img loading="lazy" src="${safe(d.md.thumb)}" alt="">`:`<b>${safe(d.tile)}</b>`}<span class="play">▶${d.md&&d.md.platform!=='YouTube'?' '+safe(d.md.platform).toUpperCase():''}</span></div><h3>${safe(d.title)}</h3><div class="meta">${safe(d.status)} · ${safe(d.credit)}</div></article>`}
function bar(t){return `<div class="bar"><h2>${safe(t)}</h2></div>`}
function render(q=''){$('#nav').innerHTML=cats.map(c=>`<button class="${c===category?'active':''}" data-cat="${safe(c)}">${safe(c)}</button>`).join('');let ql=q.toLowerCase(),list=data.filter(d=>(category==='Home'||category==='Trending'||(category==='Collections'?(d.song&&(!selectedSong||d.song===selectedSong)):d.cat===category))&&[d.title,d.tile,d.cat,d.status,d.song,d.note,d.credit].join(' ').toLowerCase().includes(ql));if(category==='Trending')list=[...list.filter(d=>d.trending),...list.filter(d=>!d.trending)];let feat=data.filter(d=>d.featured);if(feat.length<3)feat=[...feat,...data.filter(d=>!d.featured)];$('#content').innerHTML=(category==='Collections'?`<div class="collection"><strong>EXPLORE THE ALBUM COLLECTIONS</strong><select aria-label="Song collection" onchange="selectedSong=this.value;render()"><option value="">All song collections</option>${songs.map(x=>`<option ${x===selectedSong?'selected':''}>${safe(x)}</option>`).join('')}</select></div>`:'')+(category==='Home'&&!q?bar('Featured videos')+`<div class="grid featured">${feat.slice(0,3).map(tile).join('')}</div>`:'')+bar(q?'Search: '+q:category==='Home'?'Latest videos':category)+`<div class="grid">${list.map(tile).join('')}</div>`+(list.length?'':'<p>No videos found.</p>')}
$('#nav').addEventListener('click',e=>{let b=e.target.closest('button[data-cat]');if(b)choose(b.dataset.cat)});
function choose(c){category=c;selectedSong='';$('#q').value='';displayed='';if(location.hash)history.pushState(null,'',location.pathname+location.search);render();window.scrollTo(0,0)}
function home(){choose('Home')}
function watch(id){if(location.hash==='#video-'+id)show(id);else location.hash='video-'+id}
function show(id,refresh){let d=byId(id);if(!d){if(!refresh)render($('#q').value);return}if(displayed===id&&refresh)return;let first=displayed!==id;displayed=id;let liked=get('liked-'+id,false);$('#content').innerHTML=`<button onclick="home()">← Back to videos</button><h1>${safe(d.title)}</h1>${player(d)}<p class="meta">${safe(d.cat)} · ${safe(d.status)}</p><div class="actions"><button id="like" onclick="toggleLike('${d.id}')">${liked?'♥ Saved':'♡ Save'}</button><button onclick="share()">Share</button></div>${bar('Comments')}<p>${d.md?`Join the conversation on <a target="_blank" rel="noopener" href="${safe(d.md.link)}">${safe(d.md.platform)}</a>.`:'Comments open when this video drops.'}</p>${bar('Related videos')}<div class="grid">${related(d).map(tile).join('')}</div>`;if(first)window.scrollTo(0,0)}
function player(d){let m=d.md,extra=`${d.song?`<p><b>Song collection:</b> ${safe(d.song)}</p>`:''}${d.note?`<div class="note"><b>CURATOR’S NOTE</b><br>${safe(d.note)}</div>`:''}`;if(!m)return `<div class="player"><div><h2>▶ ${safe(d.tile)}</h2><p>Video not uploaded yet.</p><p>${safe(d.status)}</p></div></div>`;let watchLink=`<p><a target="_blank" rel="noopener" href="${safe(m.link)}">Watch on ${safe(m.platform)}</a> · ${safe(d.credit)}</p>`;let frame=m.embed?`<div class="player embedded${m.vertical?' vertical':''}"><iframe src="${safe(m.embed)}" title="${safe(d.title)}" referrerpolicy="strict-origin-when-cross-origin" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen scrolling="no"></iframe></div>`:m.file?`<div class="player embedded"><video src="${safe(m.link)}" controls playsinline style="width:100%;height:100%;background:#000"></video></div>`:`<div class="player"><div><h2>▶ ${safe(d.tile)}</h2><p>This ${safe(m.platform)} video plays on ${safe(m.platform)}.</p><p><a class="red" style="display:inline-block;padding:10px 14px;color:#fff;text-decoration:none;font-weight:bold" target="_blank" rel="noopener" href="${safe(m.link)}">WATCH ON ${safe(m.platform).toUpperCase()}</a></p></div></div>`;return frame+watchLink+extra}
function related(d){let same=data.filter(x=>x!==d&&(x.cat===d.cat||(d.song&&x.song===d.song)));return [...same,...data.filter(x=>x!==d&&!same.includes(x))].slice(0,4)}
function toggleLike(id){put('liked-'+id,!get('liked-'+id,false));$('#like').textContent=get('liked-'+id,false)?'♥ Saved':'♡ Save'}
async function share(){let url=location.href;try{if(navigator.share)await navigator.share({title:document.title,url});else{await navigator.clipboard.writeText(url);$('#like').insertAdjacentHTML('afterend','<span class="notice"> Link copied</span>')}}catch{}}
$('#search').onsubmit=e=>{e.preventDefault();category='Home';displayed='';if(location.hash)history.pushState(null,'',location.pathname+location.search);render($('#q').value)};
$('#submission').onsubmit=e=>{e.preventDefault();let v=id=>$(id).value.trim();let body=`Name: ${v('#s-name')}\nEmail: ${v('#s-email')}\nVideo: ${v('#s-url')}\n\n${v('#s-about')}`;location.href=`mailto:${SUBMIT_EMAIL}?subject=${encodeURIComponent('HOODSTAR submission: '+v('#s-name'))}&body=${encodeURIComponent(body)}`;e.target.reset();$('#submit').close()};
function route(refresh){let m=location.hash.match(/^#video-([A-Za-z0-9_-]+)$/);if(m)show(m[1],refresh);else{displayed='';render($('#q').value)}}
window.addEventListener('hashchange',()=>route(false));window.addEventListener('popstate',()=>route(false));
route(false);loadSheet();
</script></html>
